<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Number Generator</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --border: #e4e4e0;
      --border-hover: #c8c8c2;
      --text-primary: #141414;
      --text-secondary: #888;
      --text-muted: #c0c0bb;
      --radius: 4px;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 420px;
      padding: 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04), 0 4px 24px rgba(0,0,0,0.04);
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header h1 {
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .header p {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .output {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      background: var(--bg);
    }

    #randomNumber {
      font-family: 'DM Mono', monospace;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--text-primary);
      transition: opacity 0.15s ease, transform 0.15s ease;
      word-break: break-all;
      text-align: center;
    }

    #randomNumber.flash {
      opacity: 0;
      transform: translateY(6px);
    }

    #placeholder {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      user-select: none;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-secondary);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
      background: var(--bg);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    button:active {
      background: #ededea;
    }

    #generateButton {
      flex: 2;
      background: var(--text-primary);
      color: #ffffff;
      border-color: var(--text-primary);
    }

    #generateButton:hover {
      background: #2a2a2a;
      border-color: #2a2a2a;
      color: #ffffff;
    }

    #generateButton:active {
      background: #3a3a3a;
    }

    .feedback {
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    #copiedLabel {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      opacity: 0;
      transform: translateY(3px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #copiedLabel.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Random Number</h1>
      <p>12-digit integer · range 10¹¹ – 10¹²</p>
    </div>

    <div class="output" id="outputBox">
      <span id="placeholder">—</span>
      <span id="randomNumber" style="display:none;"></span>
    </div>

    <div class="actions">
      <button id="generateButton" onclick="handleGenerate()">Generate</button>
      <button id="copyButton" onclick="handleCopy()">Copy</button>
    </div>

    <div class="feedback">
      <span id="copiedLabel">copied</span>
    </div>
  </div>

  <script src="randomNumberGenerator.js"></script>
</body>
</html>
